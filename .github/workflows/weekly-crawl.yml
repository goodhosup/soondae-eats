name: Weekly Nationwide Soondae Truck Crawl

on:
  schedule:
    # 매주 월요일 새벽 4시 (KST, UTC 일요일 19:00) 자동 크롤링 및 데이터 갱신
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run nationwide crawler
        run: python3 crawler_v3.py --workers 2 --search-ttl 6.5 --max-blocks 4

      - name: Commit and push updated truck data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crawl_cache.db nationwide_trucks.json crawl_stats.json
          git diff --staged --quiet || (git commit -m "chore: auto-update nationwide soondae trucks data" && git push)
